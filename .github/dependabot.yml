version: 2
updates:
- package-ecosystem: bundler
  directory: "/"
  schedule:
    # Daily, to match the scheduled audit: a weekly cadence left new
    # advisories failing the audit for days before a fix PR appeared.
    interval: daily
  open-pull-requests-limit: 10
  # Also bump transitive gems (rack, nokogiri, ...); advisories there fail the audit.
  allow:
  - dependency-type: all
  # One PR per run for all minor/patch bumps (auto-merged once CI passes); majors stay separate PRs.
  groups:
    bundler-minor-patch:
      patterns:
      - "*"
      update-types:
      - minor
      - patch
- package-ecosystem: github-actions
  directory: "/"
  schedule:
    interval: weekly
  open-pull-requests-limit: 10
